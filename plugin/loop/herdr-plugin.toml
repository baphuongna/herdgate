id = "dev.herdgate.loop"
name = "herdgate-loop"
version = "0.13.2"
min_herdr_version = "0.9.5"
description = "Run an agent loop in a pane: start it with a prompt file, and when the agent settles, nudge it into the next cycle — visible in the TUI, pausable, capped. Generic: any prompt file, any cwd."
platforms = ["linux", "macos", "windows"]

# The loop lives in a workspace the plugin created (label from loop.json).
# All lifecycle goes through actions; the events hook only ever touches the
# pane recorded in its own registry — user panes exit silently.
[[actions]]
id = "status"
title = "herdgate-loop: loop status"
command = ["node", "server/index.mjs", "status"]

[[actions]]
id = "start"
title = "herdgate-loop: start the loop (reads loop.json)"
command = ["node", "server/index.mjs", "start"]

[[actions]]
id = "stop"
title = "herdgate-loop: stop the loop and close its workspace"
command = ["node", "server/index.mjs", "stop"]

[[actions]]
id = "pause"
title = "herdgate-loop: pause nudges (agent finishes its cycle)"
command = ["node", "server/index.mjs", "pause"]

[[actions]]
id = "resume"
title = "herdgate-loop: resume nudges"
command = ["node", "server/index.mjs", "resume"]

[[actions]]
id = "kick"
title = "herdgate-loop: resume and nudge now"
command = ["node", "server/index.mjs", "kick"]

# One short-lived process per event; never a daemon. A settle (idle|done) of
# OUR pane sends the next-cycle prompt; pane.exited records a broken chain —
# the owner decides whether to restart (no auto-respawn: it could fight a
# legitimately stopped loop).
[[events]]
on = "pane.agent_status_changed"
command = ["node", "server/index.mjs", "event"]

[[events]]
on = "pane.exited"
command = ["node", "server/index.mjs", "event"]
